name: Compilar APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew :app:assembleDebug
      - run: cp app/build/outputs/apk/debug/app-debug.apk ZoeSOC.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ZoeSOC-apk
          path: ZoeSOC.apk
      # Publica el APK con un enlace fijo para descargarlo desde el navegador del Tbox:
      # https://github.com/<usuario>/<repo>/releases/latest/download/ZoeSOC.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: Zoe SOC ${{ github.run_number }}
          files: ZoeSOC.apk
          make_latest: true
